<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found - Road to Code</title>
  <meta name="robots" content="noindex">
  <!-- Netlify serves this page at whatever path was requested, so every URL
       here (and in the components) is root-relative. -->
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <link rel="preload" href="/assets/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/styles.css">
  <script type="module" src="/js/main.js"></script>
</head>
<body>
  <site-header></site-header>

  <main>
    <section class="hero hero--bordered">
      <div class="container hero__content">
        <p class="eyebrow">404</p>
        <h1 class="hero__title">Page not found.</h1>
        <p class="lead hero__lead">The page you are looking for does not exist or has moved. Head back to the homepage, or use the menu to find our services and how to get in touch.</p>
        <a class="btn btn--primary btn--lg" href="/">Back to the homepage</a>
      </div>
    </section>
  </main>

  <site-footer></site-footer>
</body>
</html>
